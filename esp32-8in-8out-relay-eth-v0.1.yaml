esphome:
  name: esp32-8in-8out-relay-eth
  friendly_name: esp32_8in_8out_relay_eth
  name_add_mac_suffix: true
  
  project:
    name: "MaJerle.esp32_8in_8out_relay_eth"
    version: "0.0.6"

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:

ota:
  - platform: esphome

wifi:
# Spawn the AP with no credentials
  ap: {}

captive_portal:

#ethernet:
#  type: LAN8720
#  mdc_pin: GPIO23
#  mdio_pin: GPIO18
#  clk:
#    pin: GPIO17
#    mode: CLK_OUT
#  phy_addr: 0

dashboard_import:
  package_import_url: github://MaJerle/esphome-io-boards/esp32-8in-8out-relay-eth-v0.1.yaml
  import_full_config: false

# Simple web server goes here
#web_server:
#  port: 80

# I2C configuration
i2c:
  sda: GPIO05
  scl: GPIO16
  scan: true
  id: bus_main

# PFC expanders
pcf8574:
  - id: "pcf8574_hub_input"
    address: 0x20
    pcf8575: false
  - id: "pcf8574_leds"
    address: 0x21
    pcf8575: false

packages:
  channel_1: !include
    file: esp32-8in-8out-relay-eth-v0.1-channel.yaml
    vars:
      id: 1
      pcf_input_channel_number: 0
      switch_output_id: GPIO04
  channel_2: !include
    file: esp32-8in-8out-relay-eth-v0.1-channel.yaml
    vars:
      id: 2
      pcf_input_channel_number: 1
      switch_output_id: GPIO02
  channel_3: !include
    file: esp32-8in-8out-relay-eth-v0.1-channel.yaml
    vars:
      id: 3
      pcf_input_channel_number: 2
      switch_output_id: GPIO15
  channel_4: !include
    file: esp32-8in-8out-relay-eth-v0.1-channel.yaml
    vars:
      id: 4
      pcf_input_channel_number: 3
      switch_output_id: GPIO13
  channel_5: !include
    file: esp32-8in-8out-relay-eth-v0.1-channel.yaml
    vars:
      id: 5
      pcf_input_channel_number: 4
      switch_output_id: GPIO12
  channel_6: !include
    file: esp32-8in-8out-relay-eth-v0.1-channel.yaml
    vars:
      id: 6
      pcf_input_channel_number: 5
      switch_output_id: GPIO14
  channel_7: !include
    file: esp32-8in-8out-relay-eth-v0.1-channel.yaml
    vars:
      id: 7
      pcf_input_channel_number: 6
      switch_output_id: GPIO32
  channel_8: !include
    file: esp32-8in-8out-relay-eth-v0.1-channel.yaml
    vars:
      id: 8
      pcf_input_channel_number: 7
      switch_output_id: GPIO33

# Button list
button:
  - platform: restart
    name: "Restart"
  - platform: factory_reset
    name: "Factory reset"

# List of sensors
sensor:
  - platform: uptime
    type: seconds
    name: "Uptime"

switch:
  - platform: gpio
    name: "User led #1"
    id: user_led_1
    pin:
      pcf8574: pcf8574_leds
      number: 7
    inverted: true
  - platform: gpio
    name: "User led #2"
    id: user_led_2
    pin:
      pcf8574: pcf8574_leds
      number: 3
    inverted: true
  - platform: gpio
    name: "User led #3"
    id: user_led_3
    pin:
      pcf8574: pcf8574_leds
      number: 2
    inverted: true
  - platform: gpio
    name: "User led #4"
    id: user_led_4
    pin:
      pcf8574: pcf8574_leds
      number: 1
    inverted: true
  - platform: gpio
    name: "User led #5"
    id: user_led_5
    pin:
      pcf8574: pcf8574_leds
      number: 0
    inverted: true
